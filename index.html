<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador de sonido</title>
  <link rel="stylesheet" href="style.css?v=20261028163610" />
</head>
<body>
  <canvas id="stage"></canvas>
  <canvas id="overlay"></canvas>

  <div id="ui">
    <div class="row">
      <label class="fileBtn">
        Cargar audio(s)
        <input type="file" id="audioInput" accept="audio/*" multiple hidden />
      </label>
      <button id="playBtn">Reproducir</button>
    </div>
    <div class="row">
      <label class="fileBtn">
        Cargar video(s)
        <input type="file" id="videoInput" accept="video/*" multiple hidden />
      </label>
      <button id="prevVideo">◀</button>
      <button id="nextVideo">▶</button>
    </div>
    <div class="row">
      <button id="recBtn" title="Graba un video (el formato se elige en el panel, carpeta Grabación)">● Grabar</button>
      <button id="recPngBtn" title="Graba una imagen PNG por cuadro, con fondo transparente, mientras movés las cosas">● Grabar PNG</button>
    </div>
    <div class="row">
      <button id="pngBtn" title="Un solo archivo PNG que se mueve, con fondo transparente (solo los colores)">⬇ PNG animado</button>
      <button id="gifBtn" title="Un GIF animado: se mueve en cualquier lado">⬇ GIF</button>
      <select id="animDur" title="Cuánto dura la animación (PNG animado o GIF)"></select>
    </div>
    <div class="row">
      <label class="fileBtn" title="Elegí un PNG animado o un GIF que ya hiciste y lo convierte en la carpeta de imágenes (secuencia) que After Effects sí abre">
        ⇄ Convertir a secuencia
        <input type="file" id="convInput" accept="image/png,image/gif,image/webp,.png,.gif,.webp" hidden />
      </label>
    </div>
    <input type="file" id="presetInput" accept="application/json,.json" hidden />
    <div id="recInfo">sin mouse ni panel en el video</div>
    <div id="status">Sin archivos cargados todavía</div>

    <div class="mediaListTitle">Audios (arrastrá al centro para activar)</div>
    <div id="audioList" class="mediaList"></div>

    <div class="mediaListTitle">Videos (arrastrá al centro para activar)</div>
    <div id="videoList" class="mediaList"></div>
  </div>

  <div id="seqBar" hidden>
    <button id="seqPlay" title="Reproducir / pausar la línea de tiempo">▶</button>
    <div id="seqTrack" title="Click o arrastrá para ir a un momento. Click en una etapa para elegirla.">
      <div id="seqBlocks"></div>
      <div id="seqHead"></div>
    </div>
    <span id="seqTime">0.0 / 0.0 s</span>
  </div>

  <div id="animPreview" hidden>
    <div class="previewCard">
      <div class="previewTitle">Así quedó (se mueve):</div>
      <div class="previewStage"><img id="animImg" alt="vista previa de la animación" /></div>
      <div id="animInfo"></div>
      <div class="row">
        <button id="animSave">⬇ Guardar</button>
        <button id="animClose">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js?v=20261028163610"></script>
</body>
</html>
